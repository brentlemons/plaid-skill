# Tool configuration only.
#
# There is deliberately no [project] table and no dependency list: the skill's
# helper script runs on the Python standard library alone, so there is nothing
# to install in order to use it. pytest is the one development-time tool the
# repository expects, and it is documented in README.md rather than declared
# here, so that nothing in this file can be mistaken for a runtime requirement.

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["aidlc"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import ordering
    "B",   # bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit: this repository handles credentials
]

[tool.ruff.lint.per-file-ignores]
# The suite shells out to git and to a stubbed scanner on purpose, and plants
# obviously-fake sentinel strings that the bandit rules would otherwise read as
# hardcoded credentials.
"tests/**/*.py" = ["S101", "S105", "S106", "S404", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
